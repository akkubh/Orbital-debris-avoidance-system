<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="debatesesh.html">
  <title>TherapistBot</title>
</head>
<body>
  <h1 class="chatbot-heading" style="text-align: center;">Debate Lab</h1>
  <div class="chatbox-container">
    <div class="chatbox">
      <div class="message-container" id="message-container"></div>
      <form id="chat-form">
        <div class="user-input-container">
          <input type="text" id="user-input" class="user-input" placeholder="Chat with AI">
          <button type="submit" class="send-button">Send</button>
        </div>
      </form>
    </div>
  </div>
  <script src="debatesesh.js"></script>
</body>
</html>
